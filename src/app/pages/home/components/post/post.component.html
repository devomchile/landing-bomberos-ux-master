<div class="container mt-5">
  <div class="row">
    <div class="col-lg-9">
      <div class="post-hero glass-card">
        @if(item.featuredMedia.source_url){
        <div class="post-hero-img">
          <img [src]="item.featuredMedia.source_url" alt="Post Image" />
        </div>
        }
        <div class="post-hero-body">
          <div class="post-badges">
            @for(category of categories; track category){
            <span class="news-badge">{{ category }}</span>
            }
          </div>
          <h1>{{ item.title.rendered }}</h1>
          <div class="post-meta">
            <span class="meta-item">
              <ui-icon name="calendar_today" size="16px"></ui-icon>
              {{ formatDate(item.date) }}
            </span>
            <a [routerLink]="['/novedades']" [queryParams]="{ page: returnPage }" class="post-back">
              <ui-icon name="arrow_back" size="16px"></ui-icon>
              Volver a novedades
            </a>
          </div>
        </div>
      </div>

      <div class="post-content glass-card mt-4">
        <div class="content-post" [innerHTML]="item.content.rendered"></div>
      </div>
      <div class="mt-4">
        <a [routerLink]="['/novedades']" class="post-back">
          <ui-icon name="arrow_back" size="16px"></ui-icon>
          Volver a novedades
        </a>
      </div>
    </div>
    <div class="col-lg-3">
      <app-links-home></app-links-home>
    </div>
  </div>
</div>
