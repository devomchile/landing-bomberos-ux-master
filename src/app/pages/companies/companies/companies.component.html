<section class="companies-hero">
  <div class="companies-hero-img">
    <img
      src="./assets/images/companias/portadaCompany.jpeg"
      alt="Compañías Bomberos Malalhue"
    />
    <div class="companies-hero-overlay"></div>
    <div class="companies-hero-content">
      <ui-icon name="groups" size="3rem" color="white"></ui-icon>
      <h1>Nuestras Compañías</h1>
      <p>Conoce a los voluntarios que protegen Malalhue</p>
    </div>
  </div>
</section>

<section class="companies-section">
  <div class="container">
    <div class="row gy-4">
      <div class="col-12">
        <a [routerLink]="['/companies', 'directorio-general']" class="company-main-card glass-card">
          <div class="company-main-content">
            <div class="company-main-icon">
              <ui-icon name="shield" size="2.5rem" color="white"></ui-icon>
            </div>
            <div class="company-main-text">
              <h3>Cuerpo de Bomberos Malalhue</h3>
              <p>Directorio General</p>
            </div>
            <span class="company-main-arrow">
              <ui-icon name="arrow_forward" size="20px"></ui-icon>
            </span>
          </div>
        </a>
      </div>

      <div class="col-md-4">
        <div class="company-card glass-card">
          <div class="company-card-img">
            <img src="./assets/images/companias/primera.jpeg" alt="Primera Compañía" />
          </div>
          <div class="company-card-body">
            <h4>Primera Compañía</h4>
            <p>Bomba Malalhue</p>
            <a [routerLink]="['/companies', 'primera']" class="company-link">
              Conoce más
              <ui-icon name="arrow_forward" size="16px"></ui-icon>
            </a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="company-card glass-card">
          <div class="company-card-img">
            <img src="./assets/images/companias/segunda.jpg" alt="Segunda Compañía" />
          </div>
          <div class="company-card-body">
            <h4>Segunda Compañía</h4>
            <p>Bomba Malalhue</p>
            <a [routerLink]="['/companies', 'segunda']" class="company-link">
              Conoce más
              <ui-icon name="arrow_forward" size="16px"></ui-icon>
            </a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="company-card glass-card">
          <div class="company-card-img">
            <img src="./assets/images/companias/tercera.jpg" alt="Tercera Compañía" />
          </div>
          <div class="company-card-body">
            <h4>Tercera Compañía</h4>
            <p>Bomba Malalhue</p>
            <a [routerLink]="['/companies', 'tercera']" class="company-link">
              Conoce más
              <ui-icon name="arrow_forward" size="16px"></ui-icon>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
