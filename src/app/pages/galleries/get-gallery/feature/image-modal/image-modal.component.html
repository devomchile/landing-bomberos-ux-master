<div class="modal-header">
  <h5 class="modal-title">{{ imageTitle }}</h5>
  <button
    type="button"
    class="modal-close-btn"
    aria-label="Cerrar"
    (click)="closeModal()"
  >
    <ui-icon name="close" size="20px"></ui-icon>
  </button>
</div>
<div class="modal-body">
  <img [src]="imageUrl" class="modal-image" alt="Imagen de galería" />
</div>
