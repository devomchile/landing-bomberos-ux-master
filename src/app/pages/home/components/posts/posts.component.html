<div class="container mt-4">
  <h2>Novedades</h2>
  <div class="row">
    <div class="col-lg-9 col-md-12">
      <div class="row container-card col-12 p-0">
        @if(isLoading){
        <div class="container">
          <app-loading></app-loading>
        </div>
        } @if(!isLoading){ @for (post of posts ; track post.id) {
        <div class="col-lg-4 col-md-12 mt-4">
          <div class="news-card glass-card">
            <div class="news-card-img">
              <img [src]="post.imageUrl" alt="Post Image" class="news-img" />
            </div>
            <div class="news-card-body">
              <span class="news-badge">{{ post.category }}</span>
              <h3 class="news-title">{{ truncateText(post.title, 30) }}</h3>
              <div class="news-date">{{ formatDate(post.date) }}</div>
              <p
                class="news-excerpt"
                [innerHTML]="truncateText(post.excerpt, 150)"
              ></p>
              <a [routerLink]="['/noticia/', post.slug]" class="news-link"
                >Continuar leyendo
                <ui-icon name="arrow_forward" size="16px"></ui-icon
              ></a>
            </div>
          </div>
        </div>
        } }
      </div>
      @if(!isLoading){
      <div class="pagination glass-pagination">
        <button
          type="button"
          class="page-btn"
          (click)="previousPage()"
          [disabled]="currentPage === 1"
        >
          <ui-icon name="chevron_left"></ui-icon>
          Anterior
        </button>
        <span class="page-indicator"
          >{{ currentPage }} de {{ totalPages }}</span
        >
        <button
          type="button"
          class="page-btn"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          Siguiente
          <ui-icon name="chevron_right"></ui-icon>
        </button>
      </div>
      }
    </div>

    <div class="col-lg-3 col-md-12">
      <app-links-home></app-links-home>
    </div>
  </div>
</div>
