@if(machine){
<div class="container mt-5">
  <div class="row">
    <div class="col-md-8">
      <div class="machines-header glass-card">
        <h3>{{ machine.title?.rendered }}</h3>
      </div>
      @if(isLoading){
      <app-loading></app-loading>
      } @else {
      <div class="row row-cols-1 row-cols-md-2 g-4 mt-4">
        @if(images){ @for(image of images; track image.id){
        <div class="col">
          <div class="machine-card glass-card">
            <div class="machine-card-img">
              <img [src]="image.src" alt="image.alt" />
            </div>
            <div class="machine-card-body">
              <h5 class="machine-card-title">
                <ui-icon name="local_taxi" size="22px" color="#dc3545"></ui-icon>
                {{ image.caption }}
              </h5>
              @if(image.alt){
              <p class="machine-card-text">{{ image.alt }}</p>
              }
            </div>
          </div>
        </div>
        } }
      </div>
      }
    </div>

    <div class="col-md-4">
      <app-links-staff [name]="name"></app-links-staff>
      <app-links-home></app-links-home>
    </div>
  </div>
</div>
}
