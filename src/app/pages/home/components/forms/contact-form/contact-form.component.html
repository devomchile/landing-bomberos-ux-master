<div class="contact-form-container">
  <div class="contact-form-header glass">
    <h3>Contáctanos</h3>
    <p>
      Estamos aquí para ayudarte. Escríbenos y te responderemos a la brevedad.
    </p>
  </div>

  <div class="contact-form-content">
    <div class="contact-form-column glass-light">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-row">
          <app-float-input
            [type]="'text'"
            [title]="'Nombres'"
            [control]="contactForm.get('nombres')"
            [requiredText]="'Ingresa tu nombre completo'"
            [hint]="'E j: Juan Pérez'"
          >
          </app-float-input>
        </div>

        <div class="form-row">
          <app-float-input
            [type]="'email'"
            [title]="'Email'"
            [control]="contactForm.get('email')"
            [requiredText]="'Ingresa un email válido'"
            [hint]="'Ej: correo@ejemplo.com'"
          >
          </app-float-input>
        </div>

        <div class="form-row">
          <app-float-input
            [type]="'text'"
            [title]="'Asunto'"
            [control]="contactForm.get('asunto')"
            [requiredText]="'Indica el motivo de tu mensaje'"
            [hint]="'Ej: Consulta sobre voluntariado'"
          >
          </app-float-input>
        </div>

        <div class="form-row">
          <app-float-input
            [type]="'text'"
            [title]="'Celular'"
            [control]="contactForm.get('celular')"
            [requiredText]="'Formato: +56987654321'"
            [hint]="'Ingresa tu número con prefijo +569'"
            maxlength="12"
            (keydown)="preventPrefixDeletion($event)"
          >
          </app-float-input>
        </div>

        <div class="form-row">
          <app-float-input
            [type]="'textarea'"
            [title]="'Mensaje'"
            [control]="contactForm.get('mensaje')"
            [requiredText]="'Escribe tu mensaje aquí'"
            [hint]="'Cuéntanos cómo podemos ayudarte'"
          >
          </app-float-input>
        </div>

        <button
          type="submit"
          class="submit-btn glass-red"
          [disabled]="contactForm.invalid && contactForm.touched"
        >
          <span class="btn-text">Enviar mensaje</span>
          <ui-icon name="send"></ui-icon>
        </button>

        <div class="form-footer">
          <p>
            <ui-icon name="shield" size="14px"></ui-icon>
            Tus datos están seguros. No compartiremos tu información.
          </p>
        </div>
      </form>
    </div>

    <div class="contact-info-column">
      <div class="contact-info-card glass-red">
        <div class="contact-info-header">
          <ui-icon name="fire_extinguisher" size="2rem"></ui-icon>
          <h4>Cuerpo de Bomberos Malalhue</h4>
        </div>
        <div class="contact-info-body">
          <a
            href="https://goo.gl/maps/bVgs3Sa4bUqB7Lxy9"
            target="_blank"
            class="contact-info-link"
          >
            <div class="contact-info-icon">
              <ui-icon name="location_on"></ui-icon>
            </div>
            <div class="contact-info-text">
              <span class="contact-info-label">Dirección</span>
              <span>Covadonga n° 37, Malalhue</span>
            </div>
          </a>

          <a href="tel:632316232" class="contact-info-link">
            <div class="contact-info-icon">
              <ui-icon name="call"></ui-icon>
            </div>
            <div class="contact-info-text">
              <span class="contact-info-label">Teléfono</span>
              <span>+63 2 316232</span>
            </div>
          </a>

          <a
            href="mailto:contacto@cbmalalhue.cl?Subject=Contacto%20desde%20pagina%20web"
            class="contact-info-link"
          >
            <div class="contact-info-icon">
              <ui-icon name="mail"></ui-icon>
            </div>
            <div class="contact-info-text">
              <span class="contact-info-label">Email</span>
              <span>contacto&#64;cbmalalhue.cl</span>
            </div>
          </a>
        </div>
      </div>

      <div class="social-card glass-light">
        <p>Síguenos en redes sociales</p>
        <div class="social-links">
          <a
            href="https://web.facebook.com/primeracompania.bomberosmalalhue"
            target="_blank"
            class="social-link"
            title="Facebook"
            aria-label="Facebook"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"
              />
            </svg>
          </a>
          <a
            href="https://www.instagram.com/2da_cia_malalhue/"
            target="_blank"
            class="social-link"
            title="Instagram"
            aria-label="Instagram"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 0 2.5 1.25 1.25 0 0 1 0-2.5M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
              />
            </svg>
          </a>
          <a
            href="https://api.whatsapp.com/send?phone=+&amp;text=Hola, Bomberos!"
            target="_blank"
            class="social-link"
            title="WhatsApp"
            aria-label="WhatsApp"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-5.46-4.45-9.91-9.91-9.91m0 18.17c-1.5 0-2.97-.42-4.25-1.2l-.3-.18-3.12.82.83-3.04-.2-.31a8.3 8.3 0 0 1-1.26-4.38c0-4.59 3.73-8.32 8.32-8.32s8.32 3.73 8.32 8.32-3.73 8.32-8.32 8.32m4.56-6.23c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43s.17-.25.25-.41c.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.11-.22-.16-.47-.28z"
              />
            </svg>
          </a>
        </div>
      </div>

      <div class="map-card glass">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2355.4999641537543!2d-72.50836649931395!3d-39.54064289559982!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x96144608005d4b27%3A0x495b1ff5bb8a8272!2sBomberos%20De%20Malalhue!5e0!3m2!1ses-419!2scl!4v1680637730223!5m2!1ses-419!2scl"
          class="map-iframe"
          height="200"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
</div>
