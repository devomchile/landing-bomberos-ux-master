@if(directory){
<div class="container mt-5">
  <div class="row">
    <div class="col-md-8">
      <div class="directory-header glass-card">
        <h3>{{ directory.title?.rendered }}</h3>
        @if(featuredMedia){
        <div class="directory-hero">
          <img [src]="featuredMedia.source_url" alt="Featured Image" />
        </div>
        }
      </div>
      @if(isLoading){
      <app-loading></app-loading>
      } @else {
      <div class="row g-3 mt-4">
        @for(card of businessCards; track card.id){
        <div class="col-md-6">
          <div class="directory-card glass-card">
            <div class="directory-card-header">
              <div class="directory-avatar">
                <ui-icon name="person" size="1.5rem" color="white"></ui-icon>
              </div>
              <div>
                <h5>{{ card.name }}</h5>
                <p>{{ card.title }}</p>
              </div>
            </div>
            <ul class="directory-contacts">
              @for(contact of card.contacts; track contact.id){
              <li>
                <ui-icon [name]="getIconName(contact.iconClass)" size="18px" color="#dc3545"></ui-icon>
                <span>{{ contact.text }}</span>
              </li>
              }
            </ul>
          </div>
        </div>
        }
      </div>
      }
    </div>

    <div class="col-md-4">
      <app-links-staff [name]="name"></app-links-staff>
      <app-links-home></app-links-home>
    </div>
  </div>
</div>
}
